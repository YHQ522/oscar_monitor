{% extends "base.html" %}
{% block title %}系统配置 - 管控平台{% endblock %}
{% block content %}
<h4><i class="bi bi-gear"></i> 系统配置</h4>
<p class="text-muted small mb-3">日志持久化、数据库连接等全局设置</p>

<form id="configForm">
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card mb-3">
            <div class="card-header"><strong><i class="bi bi-database-add"></i> 数据库配置</strong></div>
            <div class="card-body">
                <div class="row g-2 mb-2">
                    <div class="col-auto">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="cfgLogEnabled" onchange="toggleLogDb()">
                            <label class="form-check-label small" for="cfgLogEnabled">启用日志持久化</label>
                        </div>
                    </div>
                    <div class="col-auto">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="cfgServerDbEnabled" onchange="toggleLogDb()">
                            <label class="form-check-label small" for="cfgServerDbEnabled">启用服务配置和用户配置持久化</label>
                        </div>
                    </div>
                </div>
                <div id="logDbSection" style="display:none;">
                    <div class="row g-2">
                        <div class="col-md-3">
                            <label class="form-label small">数据库类型</label>
                            <select class="form-select form-select-sm" id="cfgDbType" onchange="onDbTypeChange()">
                                <option value="oscar">Oscar (神通)</option>
                                <option value="mysql">MySQL</option>
                                <option value="postgresql">PostgreSQL</option>
                                <option value="oracle">Oracle</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small">日志保留天数</label>
                            <input class="form-control form-control-sm" id="cfgRetentionDays" value="30" type="number" min="1" max="365">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small">并发采集数</label>
                            <input class="form-control form-control-sm" id="cfgWorkers" value="8" type="number" min="1" max="50">
                            <small class="text-muted">同时采集的服务器数量 (1-50)</small>
                        </div>
                    </div>
                    <hr class="my-2">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label small required">数据库主机</label>
                            <input class="form-control form-control-sm" id="cfgLogDbHost" value="127.0.0.1">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small required">端口</label>
                            <input class="form-control form-control-sm" id="cfgLogDbPort" value="2003" type="number">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small required">数据库用户</label>
                            <input class="form-control form-control-sm" id="cfgLogDbUser" value="SYSDBA">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small required">数据库密码</label>
                            <input class="form-control form-control-sm" id="cfgLogDbPass" type="password">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small required">数据库名</label>
                            <input class="form-control form-control-sm" id="cfgLogDbName" value="OSRDB">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">isql路径</label>
                            <input class="form-control form-control-sm" id="cfgLogDbIsql" value="isql">
                        </div>
                    </div>
                    <div class="mt-3 border-top pt-2">
                        <small class="text-muted fw-bold">通过SSH中转（如果数据库不在本机）</small>
                        <div class="row g-2 mt-1">
                            <div class="col-md-6">
                                <label class="form-label small">SSH主机</label>
                                <input class="form-control form-control-sm" id="cfgLogDbSshHost">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label small">端口</label>
                                <input class="form-control form-control-sm" id="cfgLogDbSshPort" value="22" type="number">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">SSH用户</label>
                                <input class="form-control form-control-sm" id="cfgLogDbSshUser" value="root">
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small">SSH密码</label>
                                <input class="form-control form-control-sm" id="cfgLogDbSshPass" type="password">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-1 mb-2">
            <button type="button" class="btn btn-outline-success btn-sm" onclick="testLogDb()"><i class="bi bi-plug"></i> 测试连接</button>
            <button type="submit" class="btn btn-primary btn-sm">保存配置</button>
        </div>
        <div id="configResult" class="small text-break" style="max-height:120px;overflow-y:auto;"></div>
    </div>
</div>
</form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
let config = {{ config|tojson }};
{% raw %}

function toggleLogDb() {
    const show = document.getElementById('cfgLogEnabled').checked || document.getElementById('cfgServerDbEnabled').checked;
    document.getElementById('logDbSection').style.display = show ? '' : 'none';
}

function loadForm() {
    const db = config.log_db || {};
    document.getElementById('cfgLogEnabled').checked = config.log_enabled || false;
    document.getElementById('cfgServerDbEnabled').checked = config.server_db_enabled || false;
    document.getElementById('cfgRetentionDays').value = config.log_retention_days || 30;
    document.getElementById('cfgWorkers').value = config.collect_workers || 8;
    document.getElementById('cfgDbType').value = db.db_type || 'oscar';
    document.getElementById('cfgLogDbHost').value = db.host || '127.0.0.1';
    document.getElementById('cfgLogDbPort').value = db.port || 2003;
    document.getElementById('cfgLogDbUser').value = db.user || 'SYSDBA';
    document.getElementById('cfgLogDbPass').value = db.pass || '';
    document.getElementById('cfgLogDbName').value = db.dbname || 'OSRDB';
    document.getElementById('cfgLogDbIsql').value = db.isql || 'isql';
    document.getElementById('cfgLogDbSshHost').value = db.ssh_host || '';
    document.getElementById('cfgLogDbSshPort').value = db.ssh_port || 22;
    document.getElementById('cfgLogDbSshUser').value = db.ssh_user || 'root';
    document.getElementById('cfgLogDbSshPass').value = db.ssh_pass || '';
    toggleLogDb();
}

// 数据库类型切换时自动更新默认端口和 CLI 工具
const DB_DEFAULTS = {
    oscar:      { port:2003, user:'SYSDBA', db:'OSRDB', isql:'isql' },
    mysql:      { port:3306, user:'root',   db:'mysql', isql:'mysql' },
    postgresql: { port:5432, user:'postgres',db:'postgres', isql:'psql' },
    oracle:     { port:1521, user:'system', db:'ORCL',  isql:'sqlplus' },
};

function onDbTypeChange() {
    const t = document.getElementById('cfgDbType').value;
    const d = DB_DEFAULTS[t] || DB_DEFAULTS.oscar;
    document.getElementById('cfgLogDbPort').value = d.port;
    document.getElementById('cfgLogDbUser').value = d.user;
    document.getElementById('cfgLogDbName').value = d.db;
    document.getElementById('cfgLogDbIsql').value = d.isql;
}

document.getElementById('configForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    document.getElementById('configResult').className = 'small text-break text-warning';
    document.getElementById('configResult').textContent = '保存中...';
    const data = {
        log_db: {
            db_type: document.getElementById('cfgDbType').value || 'oscar',
            host: document.getElementById('cfgLogDbHost').value,
            port: parseInt(document.getElementById('cfgLogDbPort').value) || 2003,
            user: document.getElementById('cfgLogDbUser').value,
            pass: document.getElementById('cfgLogDbPass').value,
            dbname: document.getElementById('cfgLogDbName').value,
            isql: document.getElementById('cfgLogDbIsql').value || 'isql',
            ssh_host: document.getElementById('cfgLogDbSshHost').value,
            ssh_port: parseInt(document.getElementById('cfgLogDbSshPort').value) || 22,
            ssh_user: document.getElementById('cfgLogDbSshUser').value,
            ssh_pass: document.getElementById('cfgLogDbSshPass').value,
        },
        log_retention_days: parseInt(document.getElementById('cfgRetentionDays').value) || 30,
        collect_workers: parseInt(document.getElementById('cfgWorkers').value) || 8,
        log_enabled: document.getElementById('cfgLogEnabled').checked,
        server_db_enabled: document.getElementById('cfgServerDbEnabled').checked
    };
    try {
        const resp = await apiFetch('/api/config', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        if (resp.status === 'ok') {
            config = data;
            swalSuccess('系统配置已保存');
        } else {
            swalError(resp.error || '保存失败');
        }
    } catch (e) { swalError(e.message); }
});

async function testLogDb() {
    document.getElementById('configResult').className = 'small text-break text-warning';
    document.getElementById('configResult').textContent = '测试中...';
    const data = {
        db_type: document.getElementById('cfgDbType').value || 'oscar',
        host: document.getElementById('cfgLogDbHost').value,
        port: parseInt(document.getElementById('cfgLogDbPort').value) || 2003,
        user: document.getElementById('cfgLogDbUser').value,
        pass: document.getElementById('cfgLogDbPass').value,
        dbname: document.getElementById('cfgLogDbName').value,
        isql: document.getElementById('cfgLogDbIsql').value || 'isql',
        ssh_host: document.getElementById('cfgLogDbSshHost').value,
        ssh_port: parseInt(document.getElementById('cfgLogDbSshPort').value) || 22,
        ssh_user: document.getElementById('cfgLogDbSshUser').value,
        ssh_pass: document.getElementById('cfgLogDbSshPass').value,
    };
    try {
        const r = await apiFetch('/api/config/test-log-db', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        let h = '';
        if (r.error) { h = '<span class="small text-danger">❌ '+escapeHtml(r.error)+'</span>'; }
        else {
            if (r.ssh) h += '<span class="small text-' + (r.ssh.ok ? 'success' : 'danger') + '">SSH: ' + escapeHtml(r.ssh.msg) + '</span> ';
            if (r.db) h += '<span class="small text-' + (r.db.ok ? 'success' : 'danger') + '">DB: ' + escapeHtml(r.db.msg) + '</span>';
        }
        document.getElementById('configResult').innerHTML = h || '<span class="text-muted small">无结果</span>';
    } catch(e) {
        document.getElementById('configResult').innerHTML = '<span class="text-danger small">网络异常: ' + escapeHtml(e.message) + '</span>';
    }
}

loadForm();
{% endraw %}
</script>
{% endblock %}
