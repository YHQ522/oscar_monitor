{% extends "base.html" %}
{% block title %}SQL 终端 - 管控平台{% endblock %}
{% block head %}
<style>
    #sqlInput {
        font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        font-size: 0.9rem;
        line-height: 1.6;
        background: #1e1e1e;
        color: #d4d4d4;
        border: 1px solid #3c3c3c;
        resize: vertical;
    }
    #sqlInput:focus {
        background: #252526;
        color: #e0e0e0;
        border-color: #A16207;
        box-shadow: 0 0 0 0.2rem rgba(161,98,7,0.25);
    }
    #sqlResult {
        background: #f8f9fa;
        border-radius: 6px;
    }
    .sql-history-item {
        cursor: pointer;
        font-family: monospace;
        font-size: 0.78rem;
        padding: 4px 8px;
        border-radius: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 220px;
    }
    .sql-history-item:hover {
        background: #e9ecef;
    }
</style>
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="bi bi-terminal"></i> <span class="shimmer-text">SQL 终端</span></h4>
    <span class="badge bg-warning text-dark"><i class="bi bi-shield-lock"></i> 仅管理员可用</span>
</div>

<div class="row g-3">
    <div class="col-md-9">
        <div class="card">
            <div class="card-header py-2 d-flex align-items-center gap-2">
                <select id="serverSelect" class="form-select form-select-sm" style="width:260px;">
                    <option value="">-- 选择服务器 --</option>
                </select>
                <span class="text-muted small ms-auto">Ctrl+Enter 执行 · ↑↓ 历史</span>
            </div>
            <div class="card-body p-2">
                <textarea id="sqlInput" class="form-control" rows="6" placeholder="SELECT * FROM V_SYS_SESSIONS LIMIT 10;"></textarea>
                <div class="d-flex gap-2 mt-2">
                    <button class="btn btn-primary" onclick="execSql()"><i class="bi bi-play-fill"></i> 执行 (Ctrl+Enter)</button>
                    <button class="btn btn-outline-secondary" onclick="clearAll()"><i class="bi bi-eraser"></i> 清空</button>
                    <button class="btn btn-outline-info btn-sm ms-auto" onclick="toggleHistory()"><i class="bi bi-clock-history"></i> 历史</button>
                </div>
                <div id="historyPanel" class="mt-2 p-2 bg-light rounded" style="display:none;max-height:120px;overflow-y:auto;">
                    <div class="small fw-bold mb-1 text-muted">最近查询</div>
                    <div id="historyList" class="d-flex flex-wrap gap-1"></div>
                </div>
            </div>
        </div>
        <div id="sqlStatus" class="mt-2" style="display:none;"></div>
        <div class="card mt-2" id="sqlResultCard" style="display:none;">
            <div class="card-header py-1 d-flex justify-content-between align-items-center">
                <span><i class="bi bi-table"></i> <strong>查询结果</strong></span>
                <span id="rowCount" class="badge bg-secondary small"></span>
            </div>
            <div class="card-body p-2" id="sqlResult" style="max-height:60vh;overflow:auto;"></div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card" style="position:sticky;top:104px;">
            <div class="card-header py-1"><strong><i class="bi bi-lightbulb"></i> 快捷模板</strong></div>
            <div class="card-body p-1">
                <div class="d-grid gap-1">
                    <button class="btn btn-outline-secondary btn-sm text-start template-btn" data-sql="SELECT * FROM V_SYS_SESSIONS;">📊 所有会话</button>
                    <button class="btn btn-outline-secondary btn-sm text-start template-btn" data-sql="SELECT COUNT(*) FROM V_SYS_SESSIONS;">🔢 连接数统计</button>
                    <button class="btn btn-outline-secondary btn-sm text-start template-btn" data-sql="SELECT * FROM V$WAIT_CHAINS;">⛓ 等待链</button>
                    <button class="btn btn-outline-secondary btn-sm text-start template-btn" data-sql="SELECT * FROM V$GLOBAL_MEMORY;">🧠 数据库内存</button>
                    <button class="btn btn-outline-secondary btn-sm text-start template-btn" data-sql="SELECT * FROM V$TRANSACTION WHERE EXPLICIT_TRANS='t';">📝 非自动提交事务</button>
                    <button class="btn btn-outline-secondary btn-sm text-start template-btn" data-sql="SELECT * FROM V_SYS_DATABASE_INFO;">🗄 数据库信息</button>
                    <button class="btn btn-outline-secondary btn-sm text-start template-btn" data-sql="SELECT * FROM SYS_TABLESPACE;">💾 表空间</button>
                    <button class="btn btn-outline-secondary btn-sm text-start template-btn" data-sql="SELECT * FROM V_SYS_TOP_COST_SQLS WHERE TIME(s) > 0.5 ORDER BY TIME(s) DESC LIMIT 20;">🐌 慢SQL TOP20</button>
                </div>
                <hr class="my-2">
                <div class="small text-muted px-1">
                    <i class="bi bi-info-circle"></i> 仅支持只读查询<br>(SELECT / SHOW / DESC)
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
{% raw %}
const STORAGE_KEY = 'sql_terminal_history';
let sqlHistory = [];
let historyIndex = -1;

// 初始化
(async function init() {
    // 加载服务器列表
    try {
        const servers = await apiFetch('/api/servers');
        const sel = document.getElementById('serverSelect');
        servers.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.name || s.ssh_host || s.id;
            sel.appendChild(opt);
        });
    } catch(e) {}

    // 恢复历史
    try {
        sqlHistory = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        renderHistory();
    } catch(e) {}
})();

// ── 执行 SQL ──
async function execSql() {
    const serverId = document.getElementById('serverSelect').value;
    const sql = document.getElementById('sqlInput').value.trim();
    if (!serverId) { swalError('请先选择服务器'); return; }
    if (!sql) { swalError('请输入 SQL 语句'); return; }

    const statusEl = document.getElementById('sqlStatus');
    const resultCard = document.getElementById('sqlResultCard');
    const resultDiv = document.getElementById('sqlResult');

    statusEl.style.display = '';
    statusEl.innerHTML = '<div class="alert alert-info py-1 small mb-0"><div class="spinner-border spinner-border-sm me-1"></div>执行中...</div>';
    resultCard.style.display = 'none';

    try {
        const data = await apiFetch('/api/servers/' + serverId + '/sql-query', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sql: sql})
        });

        if (data.error) {
            statusEl.innerHTML = '<div class="alert alert-danger py-1 small mb-0">❌ ' + escapeHtml(data.error) + '</div>';
        } else {
            statusEl.style.display = 'none';
            resultCard.style.display = '';
            resultDiv.innerHTML = renderTable(data);
            const rowCount = (data.rows && data.rows.length) || 0;
            document.getElementById('rowCount').textContent = rowCount + ' 行';

            // 保存历史
            addHistory(sql);
        }
    } catch (e) {
        statusEl.innerHTML = '<div class="alert alert-danger py-1 small mb-0">' + escapeHtml(e.message) + '</div>';
    }
}

// ── 历史记录 ──
function addHistory(sql) {
    sqlHistory = sqlHistory.filter(h => h !== sql);
    sqlHistory.unshift(sql);
    if (sqlHistory.length > 30) sqlHistory.pop();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sqlHistory));
    renderHistory();
    historyIndex = -1;
}

function renderHistory() {
    const list = document.getElementById('historyList');
    if (!list) return;
    list.innerHTML = sqlHistory.map((h, i) =>
        `<span class="sql-history-item bg-white border" onclick="loadHistory(${i})" title="${escapeHtml(h)}">${escapeHtml(h.substring(0, 60))}${h.length > 60 ? '…' : ''}</span>`
    ).join('');
}

function loadHistory(idx) {
    if (idx >= 0 && idx < sqlHistory.length) {
        document.getElementById('sqlInput').value = sqlHistory[idx];
        document.getElementById('sqlInput').focus();
    }
}

function toggleHistory() {
    const panel = document.getElementById('historyPanel');
    panel.style.display = panel.style.display === 'none' ? '' : 'none';
    renderHistory();
}

function clearAll() {
    document.getElementById('sqlInput').value = '';
    document.getElementById('sqlResultCard').style.display = 'none';
    document.getElementById('sqlStatus').style.display = 'none';
    document.getElementById('sqlInput').focus();
}

// ── 快捷模板 ──
document.querySelectorAll('.template-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.getElementById('sqlInput').value = this.dataset.sql;
        document.getElementById('sqlInput').focus();
    });
});

// ── 快捷键 ──
document.addEventListener('keydown', function(e) {
    const input = document.getElementById('sqlInput');
    if (document.activeElement !== input) return;

    // Ctrl+Enter: 执行
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        execSql();
        return;
    }
    // Arrow Up: 上一条历史
    if (e.key === 'ArrowUp' && !e.shiftKey && !e.ctrlKey && sqlHistory.length > 0) {
        const pos = input.selectionStart;
        // Only navigate history if cursor is at start or end
        if (pos === 0 || pos === input.value.length) {
            e.preventDefault();
            historyIndex = Math.min(historyIndex + 1, sqlHistory.length - 1);
            input.value = sqlHistory[historyIndex] || '';
        }
    }
    // Arrow Down: 下一条历史
    if (e.key === 'ArrowDown' && !e.shiftKey && !e.ctrlKey && historyIndex >= 0) {
        const pos = input.selectionStart;
        if (pos === 0 || pos === input.value.length) {
            e.preventDefault();
            historyIndex--;
            input.value = historyIndex >= 0 ? sqlHistory[historyIndex] : '';
        }
    }
});

// ── 复用 detail.html 的渲染函数 ──
function renderTable(result) {
    if (!result || result.error) {
        return '<div class="alert alert-danger py-1 small mb-0">❌ ' + escapeHtml(result.error || '无数据') + '</div>';
    }
    if (!result.columns || result.columns.length === 0) {
        if (result.rows && result.rows.length > 0) {
            return '<pre class="small p-2 bg-light rounded mb-0">' + escapeHtml(result.rows.map(r => r.join(' | ')).join('\n')) + '</pre>';
        }
        return '<div class="text-muted small py-2 text-center">查询成功，无返回数据</div>';
    }
    let html = '<div class="table-responsive"><table class="table table-sm table-hover mb-0" style="font-size:0.85rem;">';
    html += '<thead class="table-dark"><tr>';
    result.columns.forEach(col => {
        html += '<th class="small text-nowrap">' + escapeHtml(col) + '</th>';
    });
    html += '</tr></thead><tbody>';
    if (result.rows && result.rows.length > 0) {
        result.rows.forEach(row => {
            html += '<tr>';
            for (let i = 0; i < result.columns.length; i++) {
                html += '<td class="small"><code>' + escapeHtml(String(row[i] ?? '')) + '</code></td>';
            }
            html += '</tr>';
        });
    } else {
        html += '<tr><td colspan="' + result.columns.length + '" class="text-muted text-center small py-3">无数据</td></tr>';
    }
    html += '</tbody></table></div>';
    return html;
}
{% endraw %}
</script>
{% endblock %}
