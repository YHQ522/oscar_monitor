{% extends "base.html" %}
{% block title %}修改密码 - 管控平台{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header"><strong><i class="bi bi-key"></i> 修改密码</strong></div>
            <div class="card-body">
                {% if msg %}
                <div class="alert alert-{{ 'success' if ok else 'danger' }} py-2 small">{{ msg }}</div>
                {% endif %}
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label small required">原密码</label>
                        <input type="password" name="old_password" class="form-control form-control-sm" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small required">新密码</label>
                        <input type="password" name="new_password" class="form-control form-control-sm" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">确认修改</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
