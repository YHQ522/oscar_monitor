{% extends "base.html" %}
{% block title %}修改密码 - 管控平台{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header"><strong><i class="bi bi-key"></i> 修改密码</strong></div>
            <div class="card-body">
                {% if msg %}
                <div class="alert alert-{{ 'success' if ok else 'danger' }} py-2 small">{{ msg }}</div>
                {% endif %}
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label small required">原密码</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="old_password" id="oldPwd" class="form-control pwd-masked" required autocomplete="current-password">
                            <button class="input-group-text" type="button" onclick="togglePwd('oldPwd','oldIcon')" title="显示/隐藏" tabindex="-1"><i class="bi bi-eye" id="oldIcon"></i></button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small required">新密码</label>
                        <div class="input-group input-group-sm">
                            <input type="text" name="new_password" id="newPwd" class="form-control pwd-masked" required autocomplete="new-password">
                            <button class="input-group-text" type="button" onclick="togglePwd('newPwd','newIcon')" title="显示/隐藏" tabindex="-1"><i class="bi bi-eye" id="newIcon"></i></button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">确认修改</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block head %}
<style>.pwd-masked { -webkit-text-security: disc; -moz-text-security: disc; }</style>
{% endblock %}
{% block scripts %}
<script>
function togglePwd(inputId, iconId) {
    const el = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (el.classList.contains('pwd-masked')) {
        el.classList.remove('pwd-masked');
        icon.className = 'bi bi-eye-slash';
    } else {
        el.classList.add('pwd-masked');
        icon.className = 'bi bi-eye';
    }
}
</script>
{% endblock %}
