<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 管控平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/react-bits.css') }}" rel="stylesheet">
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="login-card animate-on-scroll" data-delay="0.1">
                    <div class="card-header text-center py-4" style="background: linear-gradient(135deg, #1E3A5F 0%, #2A5080 100%); border-bottom: 2px solid #A16207; border-radius: 20px 20px 0 0;">
                        <i class="bi bi-database-check" style="font-size:2.5rem;"></i>
                        <h4 class="mt-2 mb-0">管控平台</h4>
                    </div>
                    <div class="card-body p-4">

                        <div id="loginForm">
                            {% if error %}
                            <div class="alert alert-danger py-2 small">
                                <i class="bi bi-exclamation-triangle"></i> {{ error }}
                            </div>
                            {% endif %}
                            <form method="post">
                                <div class="mb-3">
                                    <label class="form-label small required">用户名</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small required">密码</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-box-arrow-in-right"></i> 登 录
                                </button>
                            </form>
                            <div class="text-center mt-2">
                                <a href="#" class="small text-decoration-none" onclick="showReset()">忘记密码？</a>
                            </div>
                        </div>

                        <div id="resetForm" style="display:none;">
                            <h6 class="mb-3"><i class="bi bi-key"></i> 重置密码</h6>
                            <div id="resetError" class="alert alert-danger py-2 small" style="display:none;"></div>
                            <div id="resetOk" class="alert alert-success py-2 small" style="display:none;"></div>
                            <div class="mb-2">
                                <label class="form-label small required">用户名</label>
                                <input type="text" id="resetUser" class="form-control form-control-sm" placeholder="请输入您的用户名">
                            </div>
                            <div class="mb-2">
                                <label class="form-label small required">新密码</label>
                                <input type="password" id="resetPass" class="form-control form-control-sm" placeholder="至少 4 位">
                            </div>
                            <div class="mb-2">
                                <label class="form-label small required">确认新密码</label>
                                <input type="password" id="resetPass2" class="form-control form-control-sm" placeholder="再次输入新密码">
                            </div>
                            <button class="btn btn-warning btn-sm w-100 mb-2" onclick="doReset()">
                                <i class="bi bi-arrow-repeat"></i> 重置密码
                            </button>
                            <a href="#" class="small text-decoration-none" onclick="showLogin()">返回登录</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    function showReset() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('resetForm').style.display = '';
        document.getElementById('resetError').style.display = 'none';
        document.getElementById('resetOk').style.display = 'none';
    }
    function showLogin() {
        document.getElementById('loginForm').style.display = '';
        document.getElementById('resetForm').style.display = 'none';
    }
    async function doReset() {
        const u = document.getElementById('resetUser').value.trim();
        const p1 = document.getElementById('resetPass').value;
        const p2 = document.getElementById('resetPass2').value;
        document.getElementById('resetError').style.display = 'none';
        document.getElementById('resetOk').style.display = 'none';
        if (!u) { showErr('请输入用户名'); return; }
        if (p1.length < 4) { showErr('新密码至少 4 位'); return; }
        if (p1 !== p2) { showErr('两次密码不一致'); return; }
        try {
            const r = await fetch('/api/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p1})
            });
            const d = await r.json();
            if (d.ok) {
                document.getElementById('resetOk').style.display = '';
                document.getElementById('resetOk').textContent = d.msg;
            } else {
                showErr(d.msg);
            }
        } catch(e) {
            showErr('请求失败: ' + e.message);
        }
    }
    function showErr(msg) {
        document.getElementById('resetError').style.display = '';
        document.getElementById('resetError').textContent = msg;
    }
    </script>
</body>
</html>
