<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 管控平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/react-bits.css') }}" rel="stylesheet">
    <style>
        .pwd-masked { -webkit-text-security: disc; -moz-text-security: disc; }
    </style>
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="login-card animate-on-scroll" data-delay="0.1">
                    <div class="card-header text-center py-4" style="background: linear-gradient(135deg, #1E3A5F 0%, #2A5080 100%); border-bottom: 2px solid #A16207; border-radius: 20px 20px 0 0;">
                        <i class="bi bi-database-check" style="font-size:2.5rem;"></i>
                        <h4 class="mt-2 mb-0">管控平台</h4>
                    </div>
                    <div class="card-body p-4">

                        <div id="loginForm">
                            {% if error %}
                            <div class="alert alert-danger py-2 small">
                                <i class="bi bi-exclamation-triangle"></i> {{ error }}
                            </div>
                            {% endif %}
                            <form method="post">
                                <div class="mb-3">
                                    <label class="form-label small required">用户名</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small required">密码</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="text" name="password" id="loginPwd" class="form-control pwd-masked" placeholder="请输入密码" required autocomplete="current-password">
                                        <button class="input-group-text" type="button" onclick="toggleLoginPwd()" title="显示/隐藏密码" tabindex="-1">
                                            <i class="bi bi-eye" id="loginPwdIcon"></i>
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-box-arrow-in-right"></i> 登 录
                                </button>
                            </form>
                            <div class="text-center mt-2">
                                <span class="small text-muted">忘记密码？请联系管理员重置</span>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    function toggleLoginPwd() {
        const el = document.getElementById('loginPwd');
        const icon = document.getElementById('loginPwdIcon');
        if (el.classList.contains('pwd-masked')) {
            el.classList.remove('pwd-masked');
            icon.className = 'bi bi-eye-slash';
        } else {
            el.classList.add('pwd-masked');
            icon.className = 'bi bi-eye';
        }
    }
    </script>
</body>
</html>
