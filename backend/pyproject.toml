[project]
name = "oscar-monitor-backend"
version = "2.0.0"
description = "数据库监控管控平台 - FastAPI 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "paramiko>=3.4",
    "apscheduler>=3.10",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 国内镜像源：避免 uv sync 因 PyPI 网络问题卡住
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 110
target-version = "py311"
