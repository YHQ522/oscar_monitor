<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 管控平台</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon_11_pixel_server.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/react-bits.css') }}" rel="stylesheet">
    <style>
        /* ═══ 登录页 · Aurora UI 极光渐变风（与主站风格统一）═══ */
        body.login-page {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 25%, #ECFEFF 50%, #F5F3FF 75%, #FEF3C7 100%);
            background-size: 300% 300%;
            animation: auroraFlow 12s ease infinite;
            color: #1E1B4B;
        }

        @keyframes auroraFlow {
            0%   { background-position: 0% 50%; }
            25%  { background-position: 100% 0%; }
            50%  { background-position: 100% 100%; }
            75%  { background-position: 0% 100%; }
            100% { background-position: 0% 50%; }
        }

        /* ── 浮动光斑 ── */
        body.login-page::before {
            content: "";
            position: absolute;
            inset: -20%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 30% 20%, rgba(99,102,241,0.22) 0 15%, transparent 16%),
                radial-gradient(circle at 70% 60%, rgba(6,182,212,0.18) 0 18%, transparent 19%),
                radial-gradient(circle at 40% 80%, rgba(245,158,11,0.10) 0 12%, transparent 13%);
            filter: blur(40px);
            animation: drift 20s ease-in-out infinite alternate;
        }

        body.login-page::after {
            content: "";
            position: absolute;
            inset: -15%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 75% 25%, rgba(99,102,241,0.14) 0 20%, transparent 21%),
                radial-gradient(circle at 20% 70%, rgba(6,182,212,0.16) 0 14%, transparent 15%);
            filter: blur(60px);
            opacity: 0.8;
            animation: pulse 15s ease-in-out infinite alternate;
        }

        @keyframes drift {
            from { transform: translate3d(-4%, -3%, 0) scale(1); }
            to   { transform: translate3d(4%, 3%, 0) scale(1.05); }
        }

        @keyframes pulse {
            from { transform: scale(0.95); opacity: 0.7; }
            to   { transform: scale(1.05); opacity: 1; }
        }

        body.login-page .container { position: relative; z-index: 1; }

        /* ── 毛玻璃登录卡片（与主站 .card 一致）─── */
        .login-card {
            position: relative;
            background: rgba(255,255,255,0.55) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.6) !important;
            border-radius: 14px;
            box-shadow:
                0 4px 20px rgba(99,102,241,0.10),
                0 1px 3px rgba(99,102,241,0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-card:hover {
            box-shadow: 0 8px 40px rgba(99,102,241,0.14);
            border-color: rgba(99,102,241,0.3) !important;
        }

        .login-card .card-header {
            background: rgba(99,102,241,0.08) !important;
            border-bottom: 1px solid rgba(99,102,241,0.1);
            color: #1E1B4B;
        }

        .login-card .card-header i { color: #6366F1; }

        .login-card .card-header h4 {
            color: #312E81;
            font-weight: 700;
        }

        .login-card .form-label {
            color: #4338CA;
            font-weight: 500;
        }

        .login-card .input-group-text {
            background: rgba(99,102,241,0.06);
            border: 1px solid rgba(99,102,241,0.15);
            color: #6366F1;
        }

        .login-card .form-control {
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(99,102,241,0.15);
            color: #1E1B4B;
        }

        .login-card .form-control:focus {
            border-color: #6366F1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.18);
            background: rgba(255,255,255,0.9);
        }

        .login-card .form-control::placeholder {
            color: rgba(49,46,129,0.35);
        }

        .login-card .btn-primary {
            background: linear-gradient(135deg, #6366F1, #06B6D4);
            border: none;
            font-weight: 600;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(99,102,241,0.3);
            transition: all 0.3s ease;
        }

        .login-card .btn-primary:hover {
            background: linear-gradient(135deg, #4F46E5, #0891B2);
            box-shadow: 0 12px 30px rgba(99,102,241,0.4);
            transform: translateY(-1px);
        }

        .login-card .text-muted { color: #64748B !important; }

        .login-card .alert-danger {
            background: rgba(239,68,68,0.08);
            border-color: rgba(239,68,68,0.15);
            color: #B91C1C;
        }

        .pwd-masked { -webkit-text-security: disc; -moz-text-security: disc; }

        /* ── 暗色模式（与主站一致）─── */
        [data-bs-theme="dark"] body.login-page {
            background: linear-gradient(135deg, #0F0E1A 0%, #131128 30%, #1A1030 60%, #1E1B4B 100%);
            background-size: 300% 300%;
            animation: auroraFlow 12s ease infinite;
            color: #E0E7FF;
        }

        [data-bs-theme="dark"] .login-card {
            background: rgba(30,27,75,0.65) !important;
            border-color: rgba(99,102,241,0.2) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        [data-bs-theme="dark"] .login-card .card-header {
            background: rgba(99,102,241,0.15) !important;
            border-bottom-color: rgba(99,102,241,0.2);
            color: #E0E7FF;
        }

        [data-bs-theme="dark"] .login-card .card-header h4 { color: #C7D2FE; }

        [data-bs-theme="dark"] .login-card .form-label { color: #A5B4FC; }

        [data-bs-theme="dark"] .login-card .form-control {
            background: rgba(255,255,255,0.06);
            border-color: rgba(99,102,241,0.2);
            color: #E0E7FF;
        }

        [data-bs-theme="dark"] .login-card .form-control:focus {
            background: rgba(255,255,255,0.1);
        }

        [data-bs-theme="dark"] .login-card .input-group-text {
            background: rgba(99,102,241,0.1);
            border-color: rgba(99,102,241,0.2);
            color: #818CF8;
        }

        [data-bs-theme="dark"] .login-card .text-muted { color: #94A3B8 !important; }

        /* ── 移动端 ── */
        @media (max-width: 576px) {
            .login-card { border-radius: 12px; }
            .login-card .card-header { padding: 1rem !important; }
            .login-card .card-body { padding: 1.25rem !important; }
        }
    </style>
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="login-card animate-on-scroll" data-delay="0.1">
                    <div class="card-header text-center py-4">
                        <i class="bi bi-database-check" style="font-size:2.5rem;"></i>
                        <h4 class="mt-2 mb-0">管控平台</h4>
                    </div>
                    <div class="card-body p-4">

                        <div id="loginForm">
                            {% if error %}
                            <div class="alert alert-danger py-2 small">
                                <i class="bi bi-exclamation-triangle"></i> {{ error }}
                            </div>
                            {% endif %}
                            <form method="post">
                                <div class="mb-3">
                                    <label class="form-label small required">用户名</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small required">密码</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="text" name="password" id="loginPwd" class="form-control pwd-masked" placeholder="请输入密码" required autocomplete="current-password">
                                        <button class="input-group-text" type="button" onclick="toggleLoginPwd()" title="显示/隐藏密码" tabindex="-1">
                                            <i class="bi bi-eye" id="loginPwdIcon"></i>
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-box-arrow-in-right"></i> 登 录
                                </button>
                            </form>
                            <div class="text-center mt-2">
                                <span class="small text-muted">忘记密码？请联系管理员重置</span>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    function toggleLoginPwd() {
        const el = document.getElementById('loginPwd');
        const icon = document.getElementById('loginPwdIcon');
        if (el.classList.contains('pwd-masked')) {
            el.classList.remove('pwd-masked');
            icon.className = 'bi bi-eye-slash';
        } else {
            el.classList.add('pwd-masked');
            icon.className = 'bi bi-eye';
        }
    }
    </script>
</body>
</html>
